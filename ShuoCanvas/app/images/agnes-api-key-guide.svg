<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2100" viewBox="0 0 960 2100" role="img" aria-labelledby="title desc">
  <title id="title">Agnes AI API Key 获取指南</title>
  <desc id="desc">根据 Agnes 平台实际 API 密钥页整理：进入设置里的 API 密钥，点击创建新的密钥，复制个人密钥并填写到 AiCanvas。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.54" stop-color="#101827"/>
      <stop offset="1" stop-color="#15112a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ef4444"/>
    </marker>
    <style>
      .root { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
      .eyebrow { font-size: 24px; fill: rgba(255,255,255,0.64); font-weight: 800; }
      .title { font-size: 56px; fill: rgba(255,255,255,0.96); font-weight: 900; }
      .subtitle { font-size: 26px; fill: rgba(255,255,255,0.72); font-weight: 700; }
      .panel-title { font-size: 33px; fill: rgba(255,255,255,0.96); font-weight: 900; }
      .panel-text { font-size: 24px; fill: rgba(255,255,255,0.78); font-weight: 700; }
      .caption { font-size: 20px; fill: rgba(255,255,255,0.60); font-weight: 650; }
      .ui { font-size: 20px; fill: rgba(255,255,255,0.90); font-weight: 780; }
      .ui-small { font-size: 17px; fill: rgba(255,255,255,0.64); font-weight: 650; }
      .ui-dark { font-size: 18px; fill: #0b1020; font-weight: 900; }
      .step-label { font-size: 23px; fill: #0b1020; font-weight: 900; }
      .blue-label { font-size: 28px; fill: #22d3ee; font-weight: 900; }
      .red-label { font-size: 28px; fill: #ef4444; font-weight: 900; }
    </style>
  </defs>

  <rect width="960" height="2100" fill="url(#bg)"/>
  <g class="root">
    <path d="M70 128 C214 62 330 76 470 140 C620 208 724 142 888 82" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.22"/>
    <rect x="54" y="54" width="852" height="1992" rx="34" fill="rgba(255,255,255,0.052)" stroke="rgba(255,255,255,0.11)"/>

    <text x="92" y="136" class="eyebrow">AiCanvas 设置 · API Key</text>
    <text x="92" y="218" class="title">Agnes AI API Key</text>
    <text x="92" y="292" class="title">小白获取流程</text>
    <text x="92" y="342" class="subtitle">实际入口：Agnes 平台左侧“设置”里的“API 密钥”。</text>
    <text x="92" y="382" class="subtitle">不是文档页，也不是模型介绍页；直接去密钥管理页。</text>

    <rect x="92" y="422" width="776" height="120" rx="24" fill="#8b5cf6" opacity="0.13"/>
    <rect x="92" y="422" width="776" height="120" rx="24" fill="none" stroke="#22d3ee" stroke-opacity="0.36"/>
    <text x="126" y="468" class="panel-text">最短路径</text>
    <text x="126" y="512" class="panel-title">设置 → API 密钥 → 创建新的密钥 → 复制 sk-</text>

    <g transform="translate(92 610)">
      <rect width="380" height="68" rx="20" fill="url(#brand)" opacity="0.96"/>
      <text x="32" y="43" class="ui-dark">打开 Agnes 平台 API 密钥页</text>
    </g>

    <g transform="translate(92 724)" filter="url(#shadow)">
      <rect width="776" height="300" rx="28" fill="#0d1324"/>
      <rect width="776" height="300" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="62" r="28" fill="url(#brand)"/>
      <text x="45" y="74" class="step-label">1</text>
      <text x="104" y="56" class="panel-title">左侧栏进入 API 密钥</text>
      <text x="104" y="94" class="panel-text">Agnes 的真实页面在“设置”分组下。</text>

      <rect x="104" y="126" width="176" height="132" rx="18" fill="#151b2e" stroke="rgba(255,255,255,0.10)"/>
      <text x="126" y="154" class="ui-small">Agnes</text>
      <text x="126" y="188" class="ui-small">设置</text>
      <rect x="118" y="204" width="138" height="36" rx="12" fill="#262f49"/>
      <text x="136" y="228" class="ui">API 密钥</text>

      <rect x="312" y="126" width="360" height="132" rx="18" fill="#171d30" stroke="rgba(255,255,255,0.10)"/>
      <text x="338" y="170" class="ui">API 密钥</text>
      <text x="338" y="207" class="ui-small">请勿与他人共享 API 密钥</text>
      <text x="338" y="236" class="ui-small">1. 创建密钥  2. 接入模型  3. 开始探索</text>
      <path d="M660 84 L254 214" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
      <text x="568" y="84" class="blue-label">点这里</text>
      <text x="104" y="280" class="caption">看到主标题“API 密钥”，说明已经进对页面。</text>
    </g>

    <g transform="translate(92 1064)" filter="url(#shadow)">
      <rect width="776" height="300" rx="28" fill="#0d1324"/>
      <rect width="776" height="300" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="62" r="28" fill="url(#brand)"/>
      <text x="45" y="74" class="step-label">2</text>
      <text x="104" y="56" class="panel-title">点击“创建新的密钥”</text>
      <text x="104" y="94" class="panel-text">按钮在 API 密钥页面的上方。</text>

      <rect x="104" y="126" width="620" height="116" rx="18" fill="#171d30" stroke="rgba(255,255,255,0.10)"/>
      <text x="132" y="166" class="ui">API 密钥</text>
      <text x="132" y="206" class="ui-small">名称 / 密钥 / 创建时间 (UTC) / 上次使用 (UTC) / 操作</text>
      <rect x="520" y="146" width="164" height="42" rx="12" fill="#111827"/>
      <text x="540" y="173" class="ui">创建新的密钥</text>
      <path d="M440 86 L588 146" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
      <text x="316" y="88" class="blue-label">创建 Key</text>
      <text x="104" y="278" class="caption">如果已有可用密钥，也可以直接复制已有那一行。</text>
    </g>

    <g transform="translate(92 1404)" filter="url(#shadow)">
      <rect width="776" height="300" rx="28" fill="#0d1324"/>
      <rect width="776" height="300" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="62" r="28" fill="url(#brand)"/>
      <text x="45" y="74" class="step-label">3</text>
      <text x="104" y="56" class="panel-title">复制个人密钥</text>
      <text x="104" y="94" class="panel-text">复制 sk- 开头的密钥，不要复制名称。</text>

      <rect x="104" y="126" width="620" height="118" rx="18" fill="#171d30" stroke="rgba(255,255,255,0.10)"/>
      <text x="132" y="160" class="ui-small">名称</text>
      <text x="250" y="160" class="ui-small">密钥</text>
      <text x="508" y="160" class="ui-small">操作</text>
      <text x="132" y="204" class="ui">默认</text>
      <text x="250" y="204" class="ui">sk-hCQhw••••••mnWUGL</text>
      <rect x="546" y="182" width="42" height="34" rx="10" fill="#24314d"/>
      <text x="558" y="205" class="ui">⧉</text>
      <path d="M650 90 L576 182" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-red)"/>
      <text x="512" y="88" class="red-label">复制</text>
      <text x="104" y="278" class="caption">下方“企业密钥”是企业账号选项，普通用户先用个人密钥。</text>
    </g>

    <g transform="translate(92 1744)" filter="url(#shadow)">
      <rect width="776" height="244" rx="28" fill="#0d1324"/>
      <rect width="776" height="244" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="62" r="28" fill="url(#brand)"/>
      <text x="45" y="74" class="step-label">4</text>
      <text x="104" y="56" class="panel-title">填回 AiCanvas 并测试</text>
      <text x="104" y="94" class="panel-text">设置 · API Key · Agnes AI，粘贴后点测试连接。</text>
      <rect x="104" y="124" width="620" height="70" rx="18" fill="#171d30" stroke="rgba(255,255,255,0.10)"/>
      <text x="132" y="166" class="ui">API 密钥</text>
      <rect x="252" y="146" width="346" height="22" rx="11" fill="rgba(255,255,255,0.18)"/>
      <rect x="614" y="136" width="90" height="42" rx="12" fill="#3b82f6"/>
      <text x="628" y="163" class="ui">测试连接</text>
      <text x="104" y="224" class="caption">测试通过后，Agnes 模型就可以正常调用。</text>
    </g>

    <g transform="translate(92 2020)">
      <rect width="776" height="1" fill="rgba(255,255,255,0.12)"/>
      <text x="0" y="38" class="caption">重点：Agnes 的真实入口是“设置 → API 密钥”，看到“创建新的密钥”就对了。</text>
    </g>
  </g>
</svg>
