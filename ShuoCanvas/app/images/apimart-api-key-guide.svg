<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2100" viewBox="0 0 960 2100" role="img" aria-labelledby="title desc">
  <title id="title">APIMart API Key 获取指南</title>
  <desc id="desc">说明如何登录 APIMart 后点击右上角头像，选择 API 密钥，进入 API 密钥页面创建或复制 API Key，然后填写到 AiCanvas 设置。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061016"/>
      <stop offset="0.55" stop-color="#0b141f"/>
      <stop offset="1" stop-color="#101824"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ef4444"/>
    </marker>
    <style>
      .root { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
      .eyebrow { font-size: 24px; fill: rgba(255,255,255,0.62); font-weight: 800; }
      .title { font-size: 58px; fill: rgba(255,255,255,0.96); font-weight: 900; }
      .subtitle { font-size: 27px; fill: rgba(255,255,255,0.72); font-weight: 720; }
      .panel-title { font-size: 34px; fill: rgba(255,255,255,0.95); font-weight: 900; }
      .panel-text { font-size: 25px; fill: rgba(255,255,255,0.78); font-weight: 720; }
      .caption { font-size: 21px; fill: rgba(255,255,255,0.58); font-weight: 650; }
      .ui { font-size: 21px; fill: rgba(255,255,255,0.9); font-weight: 780; }
      .ui-muted { font-size: 18px; fill: rgba(255,255,255,0.55); font-weight: 650; }
      .ui-dark { font-size: 18px; fill: #062016; font-weight: 900; }
      .step-label { font-size: 23px; fill: #061016; font-weight: 900; }
      .green-label { font-size: 29px; fill: #22c55e; font-weight: 900; }
      .red-label { font-size: 30px; fill: #ef4444; font-weight: 900; }
      .link-label { font-size: 21px; fill: #062016; font-weight: 900; }
      .link-caption { font-size: 17px; fill: rgba(6,32,22,0.7); font-weight: 800; }
      a:hover .link-bg { stroke: #ffffff; }
    </style>
  </defs>

  <rect width="960" height="2100" fill="url(#bg)"/>
  <g class="root">
    <path d="M70 132 C220 58 338 86 470 142 C612 202 732 128 884 88" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.22"/>
    <path d="M80 1990 C232 1932 374 1970 512 2014 C660 2062 790 2026 888 1948" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.22"/>
    <rect x="54" y="54" width="852" height="1992" rx="34" fill="rgba(255,255,255,0.052)" stroke="rgba(255,255,255,0.11)"/>

    <text x="92" y="136" class="eyebrow">AiCanvas 设置 · API Key</text>
    <text x="92" y="218" class="title">APIMart</text>
    <text x="92" y="292" class="title">API Key 怎么获取</text>
    <text x="92" y="342" class="subtitle">登录后点右上角头像，在菜单里选“API 密钥”。</text>
    <text x="92" y="382" class="subtitle">进入 API 密钥页后创建或复制 sk- Key。</text>

    <rect x="92" y="422" width="776" height="112" rx="22" fill="#22c55e" opacity="0.12"/>
    <rect x="92" y="422" width="776" height="112" rx="22" fill="none" stroke="#22c55e" stroke-opacity="0.36"/>
    <text x="126" y="464" class="panel-text">真实路径：</text>
    <text x="126" y="502" class="panel-title">右上角头像 → API 密钥 → 创建 API 密钥</text>

    <g>
      <rect class="link-bg" x="92" y="562" width="318" height="68" rx="20" fill="url(#brand)" stroke="#22c55e" stroke-opacity="0.72"/>
      <text x="126" y="590" class="link-label">打开 APIMart</text>
      <text x="126" y="616" class="link-caption">登录后从头像菜单进入</text>
    </g>

    <g transform="translate(92 684)" filter="url(#shadow)">
      <rect width="776" height="296" rx="28" fill="#091013"/>
      <rect width="776" height="296" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="64" r="28" fill="url(#brand)"/>
      <text x="45" y="76" class="step-label">1</text>
      <text x="104" y="58" class="panel-title">登录后点右上角头像</text>
      <text x="104" y="96" class="panel-text">页面右上角会显示头像按钮，例如字母 G。</text>
      <rect x="104" y="132" width="620" height="84" rx="18" fill="#151d22" stroke="rgba(255,255,255,0.08)"/>
      <text x="132" y="166" class="ui">APIMart</text>
      <text x="262" y="166" class="ui-muted">翻译</text>
      <text x="406" y="166" class="ui-muted">6589.72</text>
      <circle cx="636" cy="166" r="28" fill="#333333" stroke="rgba(255,255,255,0.22)"/>
      <text x="626" y="174" class="ui">G</text>
      <path d="M564 82 L636 138" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
      <text x="506" y="84" class="green-label">点头像</text>
      <text x="104" y="254" class="caption">如果没登录，先登录或注册；登录后才会看到头像菜单。</text>
    </g>

    <g transform="translate(92 1014)" filter="url(#shadow)">
      <rect width="776" height="296" rx="28" fill="#091013"/>
      <rect width="776" height="296" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="64" r="28" fill="url(#brand)"/>
      <text x="45" y="76" class="step-label">2</text>
      <text x="104" y="58" class="panel-title">菜单里点 API 密钥</text>
      <text x="104" y="96" class="panel-text">头像菜单会显示“控制台”和“API 密钥”。</text>
      <rect x="104" y="132" width="620" height="108" rx="18" fill="#151d22" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="146" cy="170" r="22" fill="#333333" stroke="rgba(255,255,255,0.18)"/>
      <text x="138" y="178" class="ui">G</text>
      <text x="184" y="176" class="ui">你的账号</text>
      <text x="132" y="214" class="ui-muted">控制台</text>
      <rect x="246" y="194" width="130" height="34" rx="10" fill="#22c55e"/>
      <text x="270" y="217" class="ui-dark">API 密钥</text>
      <path d="M584 86 L312 194" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
      <text x="596" y="88" class="green-label">点 API 密钥</text>
      <text x="104" y="262" class="caption">这是用户截图里的真实入口，不是左侧栏。</text>
    </g>

    <g transform="translate(92 1344)" filter="url(#shadow)">
      <rect width="776" height="296" rx="28" fill="#091013"/>
      <rect width="776" height="296" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="64" r="28" fill="url(#brand)"/>
      <text x="45" y="76" class="step-label">3</text>
      <text x="104" y="58" class="panel-title">点创建 API 密钥</text>
      <text x="104" y="96" class="panel-text">进入“API 密钥”页，右上角有绿色创建按钮。</text>
      <rect x="104" y="132" width="620" height="98" rx="18" fill="#151d22" stroke="rgba(255,255,255,0.08)"/>
      <text x="132" y="162" class="ui">API 密钥</text>
      <text x="132" y="200" class="ui-muted">名称 / 密钥 / 额度 / 模型权限 / IP 白名单</text>
      <rect x="504" y="148" width="156" height="38" rx="12" fill="#22c55e"/>
      <text x="526" y="173" class="ui-dark">+ 创建 API 密钥</text>
      <path d="M390 86 L582 148" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-red)"/>
      <text x="236" y="86" class="red-label">点创建按钮</text>
      <text x="104" y="262" class="caption">已有密钥也可以点密钥旁边的复制图标，直接复制 sk- Key。</text>
    </g>

    <g transform="translate(92 1674)" filter="url(#shadow)">
      <rect width="776" height="254" rx="28" fill="#091013"/>
      <rect width="776" height="254" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="64" r="28" fill="url(#brand)"/>
      <text x="45" y="76" class="step-label">4</text>
      <text x="104" y="58" class="panel-title">填回 AiCanvas</text>
      <text x="104" y="96" class="panel-text">设置 → API Key → APIMart，粘贴密钥。</text>
      <rect x="104" y="132" width="620" height="70" rx="18" fill="#151d22" stroke="rgba(255,255,255,0.08)"/>
      <text x="132" y="174" class="ui">API 密钥</text>
      <rect x="260" y="152" width="394" height="22" rx="11" fill="rgba(255,255,255,0.18)"/>
      <text x="104" y="228" class="caption">线路默认国内线路 1；测试失败再切换其它线路。</text>
    </g>

    <g transform="translate(92 1970)">
      <rect width="776" height="1" fill="rgba(255,255,255,0.12)"/>
      <text x="0" y="38" class="caption">最短口径：右上角头像 → API 密钥 → 创建 API 密钥 → 复制 sk- Key。</text>
      <text x="0" y="74" class="caption">不要把 API Key 发给别人；填完保存后再点“测试连接”。</text>
    </g>
  </g>
</svg>
