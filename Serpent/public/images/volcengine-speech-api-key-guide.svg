<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2100" viewBox="0 0 960 2100" role="img" aria-labelledby="title desc">
  <title id="title">火山语音 X-Api-Key 获取指南</title>
  <desc id="desc">一张图说明如何在火山引擎开通录音文件识别 2.0、语音合成 2.0 和 Doubao-音频生成-1.0，复制火山语音 X-Api-Key，并填写到 AiCanvas。字幕识别接口参数是 volc.seedasr.auc 和 bigmodel，不是火山方舟 Ark Key。</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.46" stop-color="#111827"/>
      <stop offset="1" stop-color="#151322"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ef4444"/>
    </marker>
    <style>
      .root { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
      .eyebrow { font-size: 24px; fill: rgba(255,255,255,0.62); font-weight: 800; }
      .title { font-size: 60px; fill: rgba(255,255,255,0.96); font-weight: 900; }
      .subtitle { font-size: 28px; fill: rgba(255,255,255,0.72); font-weight: 700; }
      .caption { font-size: 22px; fill: rgba(255,255,255,0.58); font-weight: 650; }
      .panel-title { font-size: 34px; fill: rgba(15,23,42,0.98); font-weight: 900; }
      .panel-muted { font-size: 20px; fill: #64748b; font-weight: 650; }
      .ui { font-size: 20px; fill: #111827; font-weight: 760; }
      .ui-muted { font-size: 17px; fill: #64748b; font-weight: 650; }
      .ui-small { font-size: 15px; fill: #64748b; font-weight: 650; }
      .tag { font-size: 15px; fill: #475569; font-weight: 750; }
      .step-label { font-size: 23px; fill: #ffffff; font-weight: 900; }
      .note { font-size: 25px; fill: rgba(255,255,255,0.88); font-weight: 760; }
      .note-strong { font-size: 27px; fill: #ffffff; font-weight: 900; }
      .note-warn { font-size: 25px; fill: #fde68a; font-weight: 900; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; font-size: 23px; fill: #dbeafe; font-weight: 800; }
      .red-label { font-size: 31px; fill: #ef4444; font-weight: 900; }
      .red-note { font-size: 24px; fill: #ef4444; font-weight: 900; }
      .link-label { font-size: 21px; fill: #ffffff; font-weight: 900; }
      .link-caption { font-size: 17px; fill: rgba(255,255,255,0.66); font-weight: 700; }
      a:hover .link-bg { stroke: #bfdbfe; }
    </style>
  </defs>

  <rect width="960" height="2100" fill="url(#page-bg)"/>
  <g class="root">
    <path d="M68 130 C210 42 320 76 438 132 C556 188 684 134 880 72" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.22"/>
    <path d="M76 1996 C210 1934 366 1976 502 2018 C662 2068 774 2022 888 1950" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.24"/>

    <rect x="54" y="54" width="852" height="1992" rx="34" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.11)"/>
    <text x="92" y="136" class="eyebrow">AiCanvas 语音工作室</text>
    <text x="92" y="218" class="title">火山语音</text>
    <text x="92" y="292" class="title">API Key 开通流程</text>
    <text x="92" y="342" class="subtitle">照着这张图走：先开通三个火山语音服务，</text>
    <text x="92" y="380" class="subtitle">再复制火山语音 API Key 填回 AiCanvas。</text>

    <rect x="92" y="412" width="776" height="106" rx="22" fill="#f59e0b" opacity="0.13"/>
    <rect x="92" y="412" width="776" height="106" rx="22" fill="none" stroke="#facc15" stroke-opacity="0.30"/>
    <text x="126" y="446" class="note-warn">关键别点错：开通录音文件识别 2.0、</text>
    <text x="126" y="480" class="note">语音合成 2.0 和 Doubao-音频生成-1.0；</text>
    <text x="126" y="508" class="caption">字幕识别：volc.seedasr.auc + bigmodel；不是火山方舟 Ark Key。</text>

    <a href="https://console.volcengine.com/speech/new/setting/apikeys?" target="_blank" rel="noopener noreferrer">
      <rect class="link-bg" x="92" y="546" width="288" height="68" rx="20" fill="#253b76" stroke="#3b82f6" stroke-opacity="0.72"/>
      <text x="128" y="574" class="link-label">打开 API Key 管理页</text>
      <text x="128" y="600" class="link-caption">console.volcengine.com</text>
    </a>
    <g transform="translate(92 640)" filter="url(#shadow)">
      <rect width="776" height="544" rx="28" fill="#f8fafc"/>
      <rect width="776" height="544" rx="28" fill="none" stroke="#dbe3ef"/>
      <rect width="776" height="48" rx="28" fill="#ffffff"/>
      <rect y="28" width="776" height="20" fill="#ffffff"/>
      <circle cx="32" cy="24" r="6" fill="#94a3b8"/>
      <rect x="62" y="14" width="86" height="20" rx="5" fill="#e0f2fe"/>
      <text x="82" y="29" class="ui-small" fill="#2563eb">总览</text>
      <rect x="340" y="11" width="198" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="362" y="29" class="ui-small">控制台、资源、API</text>

      <rect y="48" width="120" height="496" fill="#f1f5f9"/>
      <text x="24" y="90" class="ui">豆包语音</text>
      <rect x="10" y="94" width="100" height="24" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="24" y="112" class="ui-small">新版</text>
      <text x="24" y="150" class="ui-muted">概览页</text>
      <text x="24" y="184" class="ui-muted">音色库</text>
      <text x="24" y="226" class="ui-small">系统管理</text>
      <rect x="8" y="246" width="104" height="32" rx="8" fill="#ede9fe"/>
      <text x="24" y="268" class="ui" fill="#6d28d9">开通管理</text>
      <text x="24" y="314" class="ui-muted">用量统计</text>
      <text x="24" y="350" class="ui-muted">API Key管理</text>

      <text x="150" y="96" class="panel-title">服务管理</text>
      <text x="150" y="132" class="panel-muted">进行模型开通、购买、用量查看和退订等管理操作。</text>
      <text x="160" y="178" class="ui" fill="#6d28d9">大模型</text>
      <line x1="160" y1="188" x2="208" y2="188" stroke="#6d28d9" stroke-width="3" stroke-linecap="round"/>
      <text x="235" y="178" class="ui-muted">小模型</text>

      <rect x="150" y="212" width="596" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="164" y="236" width="38" height="38" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <path d="M174 257h4l3-9 6 20 5-16 4 10h5" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="216" y="258" class="ui">录音文件识别2.0</text>
      <rect x="356" y="240" width="54" height="24" rx="6" fill="#f1f5f9"/>
      <text x="368" y="258" class="tag">未开通</text>
      <rect x="418" y="240" width="36" height="24" rx="6" fill="#f8fafc"/>
      <text x="430" y="258" class="tag">新</text>
      <rect x="464" y="240" width="118" height="24" rx="6" fill="#dbeafe"/>
      <text x="480" y="258" class="tag">新语音服务已上线</text>
      <text x="650" y="258" class="ui" fill="#6d28d9">文档</text>
      <rect x="690" y="236" width="44" height="34" rx="10" fill="#ede9fe"/>
      <text x="700" y="258" class="ui" fill="#6d28d9">开通</text>

      <rect x="150" y="326" width="596" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="164" y="350" width="38" height="38" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <path d="M174 369h4l3-9 6 20 5-16 4 10h5" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="216" y="372" class="ui">语音合成2.0</text>
      <rect x="334" y="354" width="54" height="24" rx="6" fill="#f1f5f9"/>
      <text x="346" y="372" class="tag">未开通</text>
      <text x="642" y="372" class="ui-muted">文字转语音</text>
      <rect x="690" y="350" width="44" height="34" rx="10" fill="#ede9fe"/>
      <text x="700" y="372" class="ui" fill="#6d28d9">开通</text>

      <rect x="150" y="442" width="596" height="64" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="216" y="482" class="ui">流式语音识别2.0</text>
      <rect x="690" y="456" width="44" height="34" rx="10" fill="#ede9fe"/>
      <text x="700" y="478" class="ui" fill="#6d28d9">开通</text>

      <path d="M638 88 L711 230" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-red)"/>
      <path d="M618 168 L711 344" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-red)"/>
      <text x="598" y="82" class="red-label">1</text>
      <text x="584" y="162" class="red-label">2</text>
      <text x="464" y="520" class="red-note">三个服务都点“开通”</text>
    </g>

    <g transform="translate(92 1218)">
      <rect width="776" height="150" rx="24" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.35)"/>
      <circle cx="58" cy="75" r="28" fill="url(#ok)"/>
      <text x="47" y="87" class="step-label">1</text>
      <text x="104" y="54" class="note-strong">先开通三个服务</text>
      <text x="104" y="90" class="note">录音文件识别 2.0 + 语音合成 2.0</text>
      <text x="104" y="124" class="caption">再开通 Doubao-音频生成-1.0，用于音频生成能力。</text>
    </g>

    <g transform="translate(92 1390)" filter="url(#shadow)">
      <rect width="776" height="414" rx="28" fill="#f8fafc"/>
      <rect width="776" height="414" rx="28" fill="none" stroke="#dbe3ef"/>
      <rect width="776" height="48" rx="28" fill="#ffffff"/>
      <rect y="28" width="776" height="20" fill="#ffffff"/>
      <circle cx="32" cy="24" r="6" fill="#94a3b8"/>
      <rect x="62" y="14" width="86" height="20" rx="5" fill="#e0f2fe"/>
      <text x="82" y="29" class="ui-small" fill="#2563eb">总览</text>
      <rect x="340" y="11" width="198" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="362" y="29" class="ui-small">控制台、资源、API</text>

      <rect y="48" width="120" height="366" fill="#f1f5f9"/>
      <text x="24" y="90" class="ui">豆包语音</text>
      <text x="24" y="150" class="ui-muted">语音识别</text>
      <text x="24" y="192" class="ui-small">系统管理</text>
      <text x="24" y="232" class="ui-muted">开通管理</text>
      <text x="24" y="268" class="ui-muted">用量统计</text>
      <rect x="8" y="288" width="104" height="32" rx="8" fill="#ede9fe"/>
      <text x="18" y="310" class="ui" fill="#6d28d9">API Key管理</text>

      <text x="150" y="96" class="panel-title">API Key 管理</text>
      <text x="150" y="132" class="panel-muted">API Key 是请求语音大模型服务的重要凭证，请妥善保管。</text>
      <rect x="150" y="164" width="92" height="38" rx="10" fill="#6d28d9"/>
      <text x="170" y="190" class="ui" fill="#ffffff">创建API Key</text>

      <rect x="150" y="226" width="596" height="52" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="188" y="258" class="ui-muted">名称</text>
      <text x="390" y="258" class="ui-muted">API Key</text>
      <text x="620" y="258" class="ui-muted">状态</text>
      <rect x="150" y="278" width="596" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="172" cy="309" r="8" fill="#6d28d9"/>
      <text x="192" y="317" class="ui-small" fill="#111827">api-key-20260628</text>
      <rect x="306" y="294" width="108" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="318" y="314" class="ui-small">默认体验中心使用</text>
      <text x="430" y="316" class="mono" fill="#111827">sk-****-****-****</text>
      <rect x="590" y="296" width="36" height="26" rx="7" fill="#e2e8f0"/>
      <text x="600" y="315" class="ui-small">复制</text>
      <rect x="646" y="296" width="44" height="26" rx="7" fill="#dcfce7"/>
      <text x="656" y="315" class="ui-small" fill="#15803d">启用</text>

      <path d="M500 380 L604 322" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-red)"/>
      <text x="300" y="390" class="red-label">2 复制火山语音 API Key</text>
    </g>

    <g transform="translate(92 1838)">
      <rect width="776" height="150" rx="24" fill="rgba(59,130,246,0.13)" stroke="rgba(59,130,246,0.34)"/>
      <circle cx="58" cy="75" r="28" fill="url(#brand)"/>
      <text x="47" y="87" class="step-label">2</text>
      <text x="104" y="54" class="note-strong">回到 AiCanvas：设置 → API Key → 火山语音</text>
      <text x="104" y="90" class="note">填入 X-Api-Key 后保存，再点测试连接。</text>
      <text x="104" y="124" class="caption">它不是 AccessKey / SecretKey，也不是火山方舟 Ark Key。</text>
    </g>

    <g transform="translate(92 2010)">
      <rect width="776" height="1" fill="rgba(255,255,255,0.12)"/>
      <text x="0" y="30" class="caption">最短口径：开通“录音文件识别 2.0”“语音合成 2.0”，</text>
      <text x="0" y="62" class="caption">以及“Doubao-音频生成-1.0”，再复制 Key 填入 AiCanvas 火山语音。</text>
    </g>
  </g>
</svg>
