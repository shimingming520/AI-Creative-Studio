<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2100" viewBox="0 0 960 2100" role="img" aria-labelledby="title desc">
  <title id="title">RunningHUB API Key 获取指南</title>
  <desc id="desc">说明如何从 RunningHub 官网进入，点击顶部 API，再点击 API 页面顶部的密钥，分别获取消费级会员 API Key 和企业级共享 API Key，并填写到 AiCanvas 的 RunningHUB 设置。</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.54" stop-color="#0f1419"/>
      <stop offset="1" stop-color="#12111c"/>
    </linearGradient>
    <linearGradient id="rh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8ff22"/>
      <stop offset="1" stop-color="#28d87a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#b8ff22"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ef4444"/>
    </marker>
    <style>
      .root { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
      .eyebrow { font-size: 24px; fill: rgba(255,255,255,0.62); font-weight: 800; }
      .title { font-size: 58px; fill: rgba(255,255,255,0.96); font-weight: 900; }
      .subtitle { font-size: 28px; fill: rgba(255,255,255,0.72); font-weight: 700; }
      .caption { font-size: 22px; fill: rgba(255,255,255,0.58); font-weight: 650; }
      .note { font-size: 25px; fill: rgba(255,255,255,0.88); font-weight: 760; }
      .note-strong { font-size: 28px; fill: #ffffff; font-weight: 900; }
      .panel-title { font-size: 34px; fill: rgba(255,255,255,0.95); font-weight: 900; }
      .panel-muted { font-size: 21px; fill: rgba(255,255,255,0.66); font-weight: 650; }
      .ui { font-size: 19px; fill: rgba(255,255,255,0.88); font-weight: 760; }
      .ui-muted { font-size: 16px; fill: rgba(255,255,255,0.55); font-weight: 650; }
      .ui-dark { font-size: 18px; fill: #111827; font-weight: 800; }
      .mini-title { font-size: 20px; fill: rgba(255,255,255,0.92); font-weight: 900; }
      .mini-text { font-size: 17px; fill: rgba(255,255,255,0.66); font-weight: 700; }
      .tag { font-size: 18px; fill: #b8ff22; font-weight: 900; }
      .step-label { font-size: 23px; fill: #050608; font-weight: 900; }
      .red-label { font-size: 30px; fill: #ef4444; font-weight: 900; }
      .green-label { font-size: 28px; fill: #b8ff22; font-weight: 900; }
      .link-label { font-size: 21px; fill: #050608; font-weight: 900; }
      .link-caption { font-size: 17px; fill: rgba(5,6,8,0.68); font-weight: 800; }
      a:hover .link-bg { stroke: #ffffff; }
    </style>
  </defs>

  <rect width="960" height="2100" fill="url(#page-bg)"/>
  <g class="root">
    <path d="M70 130 C214 50 328 78 448 136 C574 196 692 124 884 84" fill="none" stroke="#b8ff22" stroke-width="2" opacity="0.20"/>
    <path d="M76 1992 C218 1934 362 1972 508 2016 C662 2064 786 2022 888 1948" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.22"/>
    <rect x="54" y="54" width="852" height="1992" rx="34" fill="rgba(255,255,255,0.052)" stroke="rgba(255,255,255,0.11)"/>

    <text x="92" y="136" class="eyebrow">AiCanvas 设置 → API Key</text>
    <text x="92" y="218" class="title">RunningHUB</text>
    <text x="92" y="292" class="title">两个 API Key 怎么填</text>
    <text x="92" y="342" class="subtitle">先从 RunningHUB 官网进入，再点顶部 API。</text>
    <text x="92" y="382" class="subtitle">然后按用途复制两个不同的 Key。</text>

    <rect x="92" y="422" width="776" height="112" rx="22" fill="#b8ff22" opacity="0.12"/>
    <rect x="92" y="422" width="776" height="112" rx="22" fill="none" stroke="#b8ff22" stroke-opacity="0.36"/>
    <text x="126" y="458" class="note-strong">别混用：</text>
    <text x="246" y="458" class="note">消费级-会员 Key = 调用工作流，消耗积分。</text>
    <text x="126" y="494" class="note">企业级-共享 Key = 调用模型 API，消耗钱包余额。</text>
    <text x="126" y="522" class="caption">一个填“工作流 API 密钥”，一个填“模型 API 密钥”。</text>

    <a href="https://www.runninghub.cn/?inviteCode=rh-v1312" target="_blank" rel="noopener noreferrer">
      <rect class="link-bg" x="92" y="562" width="286" height="68" rx="20" fill="url(#rh)" stroke="#b8ff22" stroke-opacity="0.72"/>
      <text x="128" y="590" class="link-label">打开 RunningHUB 官网</text>
      <text x="128" y="616" class="link-caption">官网 → API → 密钥</text>
    </a>

    <g transform="translate(92 684)" filter="url(#shadow)">
      <rect width="776" height="412" rx="28" fill="#090b0d"/>
      <rect width="776" height="412" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <text x="38" y="58" class="panel-title">先完成这两步</text>
      <text x="38" y="92" class="panel-muted">从官网进入，保证走你的推广入口。</text>

      <rect x="38" y="120" width="700" height="112" rx="18" fill="#171b20" stroke="rgba(255,255,255,0.08)"/>
      <text x="64" y="154" class="mini-title">1. 官网首页：点顶部 API</text>
      <rect x="64" y="174" width="620" height="36" rx="10" fill="#070809"/>
      <text x="84" y="198" class="ui" fill="#ffffff">RunningHub</text>
      <text x="196" y="198" class="ui-muted">探索</text>
      <rect x="260" y="181" width="58" height="24" rx="8" fill="#b8ff22"/>
      <text x="278" y="199" class="ui-dark">API</text>
      <text x="350" y="198" class="ui-muted">模型</text>
      <text x="432" y="198" class="ui-muted">Labs</text>
      <text x="596" y="198" class="ui-muted">登录</text>
      <path d="M524 146 L300 182" fill="none" stroke="#b8ff22" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-green)"/>
      <text x="536" y="150" class="green-label">点 API</text>

      <rect x="38" y="258" width="700" height="120" rx="18" fill="#171b20" stroke="rgba(255,255,255,0.08)"/>
      <text x="64" y="292" class="mini-title">2. API 页面：点顶部“密钥”</text>
      <rect x="64" y="312" width="620" height="36" rx="10" fill="#070809"/>
      <text x="84" y="336" class="ui" fill="#ffffff">RunningHub API</text>
      <text x="224" y="336" class="ui-muted">模型API</text>
      <text x="326" y="336" class="ui-muted">AI应用API</text>
      <text x="442" y="336" class="ui-muted">工作流API</text>
      <rect x="554" y="319" width="58" height="24" rx="8" fill="#b8ff22"/>
      <text x="565" y="337" class="ui-dark">密钥</text>
      <path d="M454 286 L574 318" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-red)"/>
      <text x="366" y="288" class="red-label">点密钥</text>
      <text x="64" y="366" class="mini-text">进入后默认是“消费级-会员”，下一步复制工作流 Key。</text>
    </g>

    <g transform="translate(92 1132)">
      <rect width="776" height="176" rx="24" fill="rgba(184,255,34,0.12)" stroke="rgba(184,255,34,0.35)"/>
      <circle cx="58" cy="88" r="28" fill="url(#rh)"/>
      <text x="47" y="100" class="step-label">1</text>
      <text x="104" y="58" class="note-strong">消费级-会员 Key</text>
      <text x="104" y="96" class="note">填到：工作流 API 密钥（消费级-会员）</text>
      <text x="104" y="134" class="caption">用途：调用工作流 / AI 应用；消耗账户积分（RH 币）。</text>
    </g>

    <g transform="translate(92 1346)" filter="url(#shadow)">
      <rect width="776" height="356" rx="28" fill="#090b0d"/>
      <rect width="776" height="356" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <text x="38" y="62" class="panel-title">切换到企业级-共享</text>
      <rect x="38" y="98" width="700" height="78" rx="16" fill="#171b20" stroke="rgba(255,255,255,0.08)"/>
      <text x="64" y="130" class="ui-muted">消费级-会员</text>
      <text x="206" y="130" class="ui">企业级-共享</text>
      <text x="360" y="130" class="ui-muted">企业级-独占</text>
      <line x1="206" y1="146" x2="324" y2="146" stroke="#b8ff22" stroke-width="3" stroke-linecap="round"/>
      <text x="64" y="166" class="ui-muted">当前页复制模型 API Key。</text>

      <rect x="38" y="204" width="700" height="94" rx="16" fill="#171b20" stroke="rgba(255,255,255,0.08)"/>
      <text x="64" y="244" class="ui">名称</text>
      <text x="208" y="244" class="ui">API Key</text>
      <text x="500" y="244" class="ui">有效期</text>
      <rect x="208" y="264" width="220" height="18" rx="9" fill="rgba(255,255,255,0.14)"/>
      <text x="628" y="278" class="tag">复制</text>

      <path d="M548 54 L260 122" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-red)"/>
      <text x="560" y="56" class="red-label">切这里</text>
    </g>

    <g transform="translate(92 1738)">
      <rect width="776" height="176" rx="24" fill="rgba(59,130,246,0.13)" stroke="rgba(59,130,246,0.34)"/>
      <circle cx="58" cy="88" r="28" fill="url(#blue)"/>
      <text x="47" y="100" class="step-label" fill="#ffffff">2</text>
      <text x="104" y="58" class="note-strong">企业级-共享 Key</text>
      <text x="104" y="96" class="note">填到：模型 API 密钥（企业级-共享）</text>
      <text x="104" y="134" class="caption">用途：调用模型 API；消耗钱包余额。</text>
    </g>

    <g transform="translate(92 1952)">
      <rect width="776" height="1" fill="rgba(255,255,255,0.12)"/>
      <text x="0" y="34" class="caption">最短口径：官网 → API → 密钥 → 消费级 Key 填工作流，</text>
      <text x="0" y="68" class="caption">企业级共享 Key 填模型 API。填完保存，再点测试连接。</text>
    </g>
  </g>
</svg>
