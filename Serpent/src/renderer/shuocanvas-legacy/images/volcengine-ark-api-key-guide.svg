<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2100" viewBox="0 0 960 2100" role="img" aria-labelledby="title desc">
  <title id="title">火山方舟 API Key 获取指南</title>
  <desc id="desc">根据火山方舟控制台开通管理页面整理：先开通要用的模型服务，再进入 API Key 管理创建或复制 Key。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101326"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#16121f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b5cff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ef4444"/>
    </marker>
    <style>
      .root { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
      .eyebrow { font-size: 24px; fill: rgba(255,255,255,0.64); font-weight: 800; }
      .title { font-size: 56px; fill: rgba(255,255,255,0.96); font-weight: 900; }
      .subtitle { font-size: 26px; fill: rgba(255,255,255,0.72); font-weight: 700; }
      .panel-title { font-size: 33px; fill: rgba(255,255,255,0.96); font-weight: 900; }
      .panel-text { font-size: 24px; fill: rgba(255,255,255,0.78); font-weight: 700; }
      .caption { font-size: 20px; fill: rgba(255,255,255,0.60); font-weight: 650; }
      .ui { font-size: 20px; fill: rgba(255,255,255,0.92); font-weight: 780; }
      .ui-small { font-size: 17px; fill: rgba(255,255,255,0.64); font-weight: 650; }
      .ui-dark { font-size: 18px; fill: #101326; font-weight: 900; }
      .ui-light { font-size: 17px; fill: #334155; font-weight: 760; }
      .ui-purple { font-size: 17px; fill: #5b5cff; font-weight: 900; }
      .step-label { font-size: 23px; fill: #101326; font-weight: 900; }
      .purple-label { font-size: 28px; fill: #a78bfa; font-weight: 900; }
      .red-label { font-size: 28px; fill: #ef4444; font-weight: 900; }
    </style>
  </defs>

  <rect width="960" height="2100" fill="url(#bg)"/>
  <g class="root">
    <path d="M70 128 C220 58 338 86 470 142 C612 202 732 128 884 88" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.24"/>
    <rect x="54" y="54" width="852" height="1992" rx="34" fill="rgba(255,255,255,0.052)" stroke="rgba(255,255,255,0.11)"/>

    <text x="92" y="136" class="eyebrow">AiCanvas 设置 · API Key</text>
    <text x="92" y="218" class="title">火山方舟 API Key</text>
    <text x="92" y="292" class="title">开通与获取流程</text>
    <text x="92" y="342" class="subtitle">先开通 AiCanvas 要用的模型服务。</text>
    <text x="92" y="382" class="subtitle">再去 API Key 管理里创建或复制密钥。</text>

    <rect x="92" y="422" width="776" height="120" rx="24" fill="#7c3aed" opacity="0.13"/>
    <rect x="92" y="422" width="776" height="120" rx="24" fill="none" stroke="#a78bfa" stroke-opacity="0.36"/>
    <text x="126" y="468" class="panel-text">最短路径</text>
    <text x="126" y="512" class="panel-title">开通管理 → 开通服务 → API Key 管理 → 创建 Key</text>

    <g transform="translate(92 610)">
      <rect width="376" height="68" rx="20" fill="url(#brand)" opacity="0.96"/>
      <text x="32" y="43" class="ui-dark">打开火山方舟开通管理</text>
    </g>

    <g transform="translate(92 724)" filter="url(#shadow)">
      <rect width="776" height="300" rx="28" fill="#101426"/>
      <rect width="776" height="300" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="62" r="28" fill="url(#brand)"/>
      <text x="45" y="74" class="step-label">1</text>
      <text x="104" y="56" class="panel-title">进入“开通管理”</text>
      <text x="104" y="94" class="panel-text">左侧菜单里点击开通管理。</text>

      <rect x="104" y="126" width="160" height="132" rx="18" fill="#eef2ff"/>
      <text x="128" y="158" class="ui-light">火山方舟</text>
      <rect x="118" y="178" width="126" height="38" rx="12" fill="#e9ddff"/>
      <text x="140" y="203" class="ui-purple">开通管理</text>
      <text x="132" y="244" class="ui-light">API Key 管理</text>

      <rect x="306" y="126" width="390" height="132" rx="18" fill="#f8fafc"/>
      <text x="332" y="158" class="ui-light">模型服务列表</text>
      <text x="332" y="192" class="ui-light">语言模型 / 视觉模型 / 向量模型</text>
      <text x="332" y="226" class="ui-light">状态：未开通</text>
      <path d="M664 84 L242 190" fill="none" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
      <text x="548" y="84" class="purple-label">点这里</text>
      <text x="104" y="280" class="caption">未登录时先登录火山引擎账号，登录后回到控制台继续。</text>
    </g>

    <g transform="translate(92 1064)" filter="url(#shadow)">
      <rect width="776" height="300" rx="28" fill="#101426"/>
      <rect width="776" height="300" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="62" r="28" fill="url(#brand)"/>
      <text x="45" y="74" class="step-label">2</text>
      <text x="104" y="56" class="panel-title">开通要用的模型服务</text>
      <text x="104" y="94" class="panel-text">找到模型行，点右侧“开通服务”。</text>

      <rect x="104" y="126" width="620" height="126" rx="18" fill="#f8fafc"/>
      <text x="132" y="158" class="ui-light">模型名 / 提供方</text>
      <text x="330" y="158" class="ui-light">状态</text>
      <text x="500" y="158" class="ui-light">操作</text>
      <text x="132" y="198" class="ui-purple">Doubao-Seed-2.1-turbo</text>
      <text x="330" y="198" class="ui-light">未开通</text>
      <text x="500" y="198" class="ui-purple">开通服务</text>
      <text x="500" y="232" class="ui-purple">一键开通所有模型</text>
      <path d="M684 90 L584 190" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-red)"/>
      <text x="566" y="86" class="red-label">开通</text>
      <text x="104" y="282" class="caption">只开通你要用的模型即可；不确定时可以先开通常用模型。</text>
    </g>

    <g transform="translate(92 1404)" filter="url(#shadow)">
      <rect width="776" height="300" rx="28" fill="#101426"/>
      <rect width="776" height="300" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="62" r="28" fill="url(#brand)"/>
      <text x="45" y="74" class="step-label">3</text>
      <text x="104" y="56" class="panel-title">进入“API Key 管理”</text>
      <text x="104" y="94" class="panel-text">开通服务后，再创建或复制 Key。</text>

      <rect x="104" y="126" width="170" height="118" rx="18" fill="#eef2ff"/>
      <text x="126" y="162" class="ui-light">开通管理</text>
      <rect x="118" y="184" width="138" height="38" rx="12" fill="#e9ddff"/>
      <text x="132" y="209" class="ui-purple">API Key 管理</text>

      <rect x="314" y="126" width="410" height="118" rx="18" fill="#f8fafc"/>
      <text x="342" y="162" class="ui-light">API Key 管理</text>
      <rect x="520" y="146" width="154" height="42" rx="12" fill="#7c3aed"/>
      <text x="540" y="173" class="ui">创建 API Key</text>
      <text x="342" y="216" class="ui-light">已有 Key 时直接复制可用密钥</text>
      <path d="M650 88 L594 146" fill="none" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
      <text x="528" y="86" class="purple-label">创建 Key</text>
      <text x="104" y="278" class="caption">Key 创建后复制保存，后续在 AiCanvas 中填写。</text>
    </g>

    <g transform="translate(92 1744)" filter="url(#shadow)">
      <rect width="776" height="244" rx="28" fill="#101426"/>
      <rect width="776" height="244" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="56" cy="62" r="28" fill="url(#brand)"/>
      <text x="45" y="74" class="step-label">4</text>
      <text x="104" y="56" class="panel-title">填回 AiCanvas 并测试</text>
      <text x="104" y="94" class="panel-text">设置 · API Key · 火山方舟，粘贴后点测试连接。</text>
      <rect x="104" y="124" width="620" height="70" rx="18" fill="#171d30" stroke="rgba(255,255,255,0.10)"/>
      <text x="132" y="166" class="ui">API 密钥</text>
      <rect x="252" y="146" width="346" height="22" rx="11" fill="rgba(255,255,255,0.18)"/>
      <rect x="614" y="136" width="90" height="42" rx="12" fill="#5b5cff"/>
      <text x="628" y="163" class="ui">测试连接</text>
      <text x="104" y="224" class="caption">测试通过后，就可以在节点里使用已开通的火山方舟模型。</text>
    </g>

    <g transform="translate(92 2020)">
      <rect width="776" height="1" fill="rgba(255,255,255,0.12)"/>
      <text x="0" y="38" class="caption">重点：先开通模型服务，再创建或复制 API Key，最后回 AiCanvas 测试连接。</text>
    </g>
  </g>
</svg>
